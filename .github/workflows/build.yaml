name: Build APC Modbus USB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apc_modbus_usb
          file: ./apc_modbus_usb/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ordinary87/apc-modbus-usb:0.1.3,ghcr.io/ordinary87/apc-modbus-usb:latest
